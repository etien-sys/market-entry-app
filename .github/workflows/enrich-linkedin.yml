name: Enrich LinkedIn Contacts

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: 'Path to LinkedIn CSV in repo (e.g. data/linkedin_connections.csv)'
        required: false
        default: 'data/linkedin_connections.csv'

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install anthropic SDK
        run: pip install anthropic

      - name: Run enrichment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/import-linkedin.py "${{ github.event.inputs.csv_path }}"

      - name: Commit contacts.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/contacts.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh LinkedIn contacts ($(date -u +%Y-%m-%d))"
            git push
          fi
