name: Sync Events from Notion

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 6 AM UTC
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync events from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: python3 scripts/sync-events.py

      - name: Apply manual overrides
        run: python3 scripts/apply-overrides.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/contacts.json
          if git diff --cached --quiet; then
            echo "No changes — events are up to date"
          else
            git commit -m "chore: sync events from Notion ($(date -u +%Y-%m-%d))"
            git push
          fi
