name: Sync Warm Contacts from Notion

on:
  schedule:
    - cron: '30 6 * * *'   # daily at 6:30 AM UTC (after events sync)
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync warm contacts from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: python3 scripts/sync-warm-contacts.py

      - name: Apply manual overrides
        run: python3 scripts/apply-overrides.py

      - name: Push contacts.json to gh-pages (live app)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit to current branch (source of truth)
          git add public/contacts.json
          if git diff --cached --quiet; then
            echo "No changes to contacts.json"
            exit 0
          fi
          git commit -m "chore: sync warm contacts from Notion ($(date -u +%Y-%m-%d))"
          git push

          # Also push contacts.json directly to gh-pages (live app reads it from there)
          git fetch origin gh-pages
          GH_SHA=$(git rev-parse origin/gh-pages)
          OLD_TREE=$(git cat-file -p "$GH_SHA" | awk '/^[0-9]+ tree / {print $3}')
          if [ -z "$OLD_TREE" ]; then
            echo "ERROR: could not read gh-pages tree — aborting gh-pages update to avoid data loss"
            exit 0
          fi
          BLOB=$(git hash-object -w public/contacts.json)
          NEW_TREE=$(git cat-file -p "$OLD_TREE" | sed "s/[a-f0-9]\{40\}\(.*contacts\.json\)/$BLOB\1/" | git mktree)
          NEW_COMMIT=$(git commit-tree "$NEW_TREE" -p "$GH_SHA" \
            -m "chore: sync warm contacts from Notion ($(date -u +%Y-%m-%d))")
          git push origin "$NEW_COMMIT":refs/heads/gh-pages
          echo "gh-pages updated"
